name: Dedicator

on:
  push:
    branches: [main, master]
    paths:
      - "dedicator/**"
      - "ddi-l-to-healthdcat-ap/**"
      - ".github/workflows/dedicator.yml"
  pull_request:
    paths:
      - "dedicator/**"
      - "ddi-l-to-healthdcat-ap/**"
      - ".github/workflows/dedicator.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dedicator/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: dedicator/web/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build

  publish-image:
    needs: build-web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        run: |
          # OCI/Docker repository names must be lowercase (org may be mixed-case)
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/dedicator"
          sha="${GITHUB_SHA::12}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:latest,${image}:${sha}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dedicator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-fly:
    needs: publish-image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip without Fly token
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN not set; skipping Fly deploy"
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: |
          set -euo pipefail
          APP="$(awk -F'"' '/^app[[:space:]]*=/ {print $2; exit}' dedicator/fly.toml)"
          if [ -z "${APP}" ]; then
            echo "No app name in dedicator/fly.toml" >&2
            exit 1
          fi
          if ! flyctl status --app "${APP}" >/dev/null 2>&1; then
            echo "Fly app '${APP}' not found — creating it…"
            # Optional: set repo variable FLY_ORG (personal org is fine; no MS Fly org required)
            if [ -n "${FLY_ORG:-}" ]; then
              flyctl apps create "${APP}" --org "${FLY_ORG}"
            else
              flyctl apps create "${APP}"
            fi
          fi
          # Build on Fly from Dockerfile (do not pull ghcr.io — package is under the GitHub
          # org and usually private; personal Fly tokens cannot read it anonymously).
          flyctl deploy \
            --app "${APP}" \
            --config dedicator/fly.toml \
            --dockerfile dedicator/Dockerfile \
            --remote-only
        env:
          FLY_ORG: ${{ vars.FLY_ORG }}
