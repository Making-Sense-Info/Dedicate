name: Dedicator

on:
  push:
    branches: [main, master]
    paths:
      - "dedicator/**"
      - "ddi-l-to-healthdcat-ap/**"
      - ".github/workflows/dedicator.yml"
  pull_request:
    paths:
      - "dedicator/**"
      - "ddi-l-to-healthdcat-ap/**"
      - ".github/workflows/dedicator.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dedicator/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: dedicator/web/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build

  publish-image:
    needs: build-web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        run: |
          # OCI/Docker repository names must be lowercase (org may be mixed-case)
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/dedicator"
          sha="${GITHUB_SHA::12}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:latest,${image}:${sha}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dedicator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-fly:
    needs: publish-image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      GHCR_IMAGE: ${{ needs.publish-image.outputs.image }}:${{ needs.publish-image.outputs.sha }}
    steps:
      - name: Skip without Fly token
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN not set; skipping Fly deploy"
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: docker/setup-buildx-action@v3
        if: env.FLY_API_TOKEN != ''
      - uses: docker/login-action@v3
        if: env.FLY_API_TOKEN != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        env:
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          APP="$(awk -F'"' '/^app[[:space:]]*=/ {print $2; exit}' dedicator/fly.toml)"
          if [ -z "${APP}" ]; then
            echo "No app name in dedicator/fly.toml" >&2
            exit 1
          fi
          if ! flyctl status --app "${APP}" >/dev/null 2>&1; then
            echo "Fly app '${APP}' not found — creating it…"
            if [ -n "${FLY_ORG:-}" ]; then
              flyctl apps create "${APP}" --org "${FLY_ORG}"
            else
              flyctl apps create "${APP}"
            fi
          fi

          # Personal Fly cannot pull private org GHCR. GHA can → retag to Fly registry.
          sha="${GITHUB_SHA::12}"
          fly_image="registry.fly.io/${APP}:${sha}"
          echo "Pull ${GHCR_IMAGE}"
          docker pull "${GHCR_IMAGE}"
          docker tag "${GHCR_IMAGE}" "${fly_image}"
          flyctl auth docker
          echo "Push ${fly_image}"
          docker push "${fly_image}"
          flyctl deploy \
            --app "${APP}" \
            --config dedicator/fly.toml \
            --image "${fly_image}" \
            --remote-only
