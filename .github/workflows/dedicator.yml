name: Dedicator

on:
  push:
    branches: [main, master]
    paths:
      - "dedicator/**"
      - "ddi-l-to-healthdcat-ap/**"
      - ".github/workflows/dedicator.yml"
  pull_request:
    paths:
      - "dedicator/**"
      - "ddi-l-to-healthdcat-ap/**"
      - ".github/workflows/dedicator.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SPARNA_JAR: shacl-play-app-0.12.5-onejar.jar
  SPARNA_URL: https://github.com/sparna-git/shacl-play/releases/download/0.12.5/shacl-play-app-0.12.5-onejar.jar

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dedicator/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: dedicator/web/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: web-dist
          path: dedicator/web/dist
          retention-days: 2

  publish-image:
    needs: build-web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}
      fly_image: ${{ steps.meta.outputs.fly_image }}
      push_fly: ${{ steps.meta.outputs.push_fly }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dedicator/web/dist

      - name: Cache Sparna jar
        uses: actions/cache@v6
        with:
          path: dedicator/jars/${{ env.SPARNA_JAR }}
          key: sparna-${{ env.SPARNA_JAR }}

      - name: Ensure Sparna jar
        run: |
          set -euo pipefail
          mkdir -p dedicator/jars
          if [ ! -f "dedicator/jars/${SPARNA_JAR}" ]; then
            curl -fsSL -L -o "dedicator/jars/${SPARNA_JAR}" "${SPARNA_URL}"
          fi
          ls -lh "dedicator/jars/${SPARNA_JAR}"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/dedicator"
          sha="${GITHUB_SHA::12}"
          tags="${image}:latest,${image}:${sha}"
          push_fly=false
          fly_image=""
          if [ -n "${FLY_API_TOKEN:-}" ]; then
            APP="$(awk -F'"' '/^app[[:space:]]*=/ {print $2; exit}' dedicator/fly.toml)"
            fly_image="registry.fly.io/${APP}:${sha}"
            tags="${tags},${fly_image}"
            push_fly=true
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "fly_image=${fly_image}" >> "$GITHUB_OUTPUT"
          echo "push_fly=${push_fly}" >> "$GITHUB_OUTPUT"

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Login Fly registry
        if: env.FLY_API_TOKEN != ''
        run: flyctl auth docker

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: dedicator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            WEB_MODE=compiled
          cache-from: type=gha,scope=dedicator
          cache-to: type=gha,mode=max,scope=dedicator

  deploy-fly:
    needs: publish-image
    if: github.event_name != 'pull_request' && needs.publish-image.outputs.push_fly == 'true'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_IMAGE: ${{ needs.publish-image.outputs.fly_image }}
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          APP="$(awk -F'"' '/^app[[:space:]]*=/ {print $2; exit}' dedicator/fly.toml)"
          if ! flyctl status --app "${APP}" >/dev/null 2>&1; then
            echo "Fly app '${APP}' not found — creating it…"
            if [ -n "${FLY_ORG:-}" ]; then
              flyctl apps create "${APP}" --org "${FLY_ORG}"
            else
              flyctl apps create "${APP}"
            fi
          fi
          flyctl deploy \
            --app "${APP}" \
            --config dedicator/fly.toml \
            --image "${FLY_IMAGE}" \
            --remote-only
