# Deploy from repository root (build context = repo root, same as Docker build):
#   fly apps create dedicator
#   fly deploy . -c dedicator/fly.toml --dockerfile dedicator/Dockerfile
app = "dedicator"
primary_region = "cdg"

[build]
  # Relative to deploy working directory (must be repo root — see CI / README).
  dockerfile = "dedicator/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
